# The full stack: Postgres (pgvector), the API, two workers and the web UI.
# Run it on a server or in CI. The author does not run it on a laptop.
#   docker compose up -d --build
#   docker compose exec api fdeops keys create --name admin --role admin
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fdeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fdeops}
      POSTGRES_DB: fdeops
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdeops"]
      interval: 5s
      retries: 10

  api:
    build: {context: ., dockerfile: docker/app.Dockerfile}
    environment: &app-env
      FDEOPS_DATABASE_URL: postgresql+psycopg://fdeops:${POSTGRES_PASSWORD:-fdeops}@postgres:5432/fdeops
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FDEOPS_CORS_ORIGINS: ${FDEOPS_CORS_ORIGINS:-}
    volumes: [data:/data]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  worker:
    build: {context: ., dockerfile: docker/app.Dockerfile}
    command: ["fdeops", "worker"]
    environment: *app-env
    # The image health check calls the HTTP API. A worker has no HTTP port.
    healthcheck: {disable: true}
    volumes: [data:/data]
    deploy: {replicas: 2}
    depends_on:
      postgres: {condition: service_healthy}

  web:
    build: {context: ., dockerfile: docker/web.Dockerfile}
    ports: ["8080:80"]

volumes:
  pgdata:
  data:
