# The production configuration for Parcelpoint with a real (free) model. The index has only current sections.
id: parcelpoint-production
model:
  provider: openrouter
  name: CHOOSE-A-FREE-MODEL:free
  temperature: 0.0
  max_tokens: 800
prompt_version: support_v1
retrieval:
  mode: hybrid
  top_k: 4
  include_superseded: false
max_steps: 8
max_turns: 3
policy_guardrail: observe
