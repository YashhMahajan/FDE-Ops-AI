# Optional. Install with: uv run pre-commit install   (or: pipx run pre-commit install)
# The hooks run the same checks as CI, on the files that you change.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/
      - id: private-key
        name: no private key in a file
        entry: bash -c 'if grep -rIl -e "-----BEGIN [A-Z ]*PRIVATE KEY-----" "$@"; then exit 1; fi' --
        language: system
