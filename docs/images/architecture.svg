<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Your agent calls tools through a connector stack into a simulated tenant world. An oracle, evaluators, statistics and gates judge the result.">
<title>Your agent calls tools through a connector stack into a simulated tenant world. An oracle, evaluators, statistics and gates judge the result.</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#111827"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#1d4ed8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#15803d"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#b91c1c"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#6b7280"/></marker></defs>
<rect width="1200" height="622" fill="#ffffff"/>
<text x="40" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="start">Your agent's tool calls pass the same checks as ours</text><text x="40" y="82" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4b5563" text-anchor="start">The oracle decides what was correct. A model never writes the answer key.</text><rect x="40" y="130" width="200" height="140" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="140" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Your agent</text><text x="140" y="204" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#4b5563" text-anchor="middle">Any framework,</text><text x="140" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#4b5563" text-anchor="middle">any model, or the</text><text x="140" y="248" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#4b5563" text-anchor="middle">reference agent</text><polyline points="244,200 326,200" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="285" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">tool call</text><rect x="330" y="110" width="350" height="270" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="352" y="142" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Connector stack</text><rect x="348" y="158" width="314" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="360" y="181" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#111827" text-anchor="start">Permission guard</text><text x="652" y="181" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="end">checks the scopes</text><rect x="348" y="200" width="314" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="360" y="223" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#111827" text-anchor="start">Policy monitor</text><text x="652" y="223" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="end">flags each violation</text><rect x="348" y="242" width="314" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="360" y="265" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#111827" text-anchor="start">Resilience</text><text x="652" y="265" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="end">retry, breaker, idempotency key</text><rect x="348" y="284" width="314" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="360" y="307" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#111827" text-anchor="start">Fault injection</text><text x="652" y="307" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="end">timeouts, bad data, outages</text><rect x="348" y="326" width="314" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="360" y="349" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#111827" text-anchor="start">Audit log</text><text x="652" y="349" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="end">hash chain, tamper evident</text><polyline points="684,245 766,245" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="725" y="231" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle">API call</text><rect x="770" y="110" width="390" height="270" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="792" y="142" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Tenant world (simulated)</text><rect x="788" y="160" width="354" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="802" y="185" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#111827" text-anchor="start">Business APIs and data</text><text x="802" y="205" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">customers, invoices, shipments</text><rect x="788" y="228" width="354" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="802" y="253" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#111827" text-anchor="start">Knowledge base</text><text x="802" y="273" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">each version has a date</text><rect x="788" y="296" width="354" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="802" y="321" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#111827" text-anchor="start">Incidents</text><text x="802" y="341" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">drift, outage, dirty data</text><rect x="40" y="450" width="260" height="100" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="58" y="484" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Oracle</text><text x="58" y="512" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">policy + state give the</text><text x="58" y="532" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">correct end state</text><polyline points="304,500 326,500" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="330" y="450" width="260" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="348" y="484" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Evaluators</text><text x="348" y="512" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">end state, trace,</text><text x="348" y="532" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">and policy flags</text><polyline points="594,500 616,500" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="620" y="450" width="260" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="638" y="484" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Statistics</text><text x="638" y="512" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">95% intervals, paired</text><text x="638" y="532" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">tests, pass^k</text><polyline points="884,500 906,500" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="910" y="450" width="260" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="928" y="484" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start">Gates and reports</text><text x="928" y="512" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">release or reject,</text><text x="928" y="532" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">with the reason</text><polyline points="965,384 965,418 460,418 460,446" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="712" y="410" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle">end state and trace</text><rect x="60" y="398" width="220" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="170" y="420" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4b5563" text-anchor="middle">policy.yaml of the tenant</text><polyline points="170,434 170,446" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/><text x="40" y="598" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">The tenant files (policy, knowledge base, gates, monitors) hold all customer rules. Platform code names no tenant.</text>
</svg>
