<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 474" width="1200" height="474" role="img" aria-label="The closed loop: monitor, evaluate, diagnose, fix, gate, approve, then monitor again">
<title>The closed loop: monitor, evaluate, diagnose, fix, gate, approve, then monitor again</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#111827"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#1d4ed8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#15803d"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#b91c1c"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#6b7280"/></marker></defs>
<rect width="1200" height="474" fill="#ffffff"/>
<text x="40" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="start">One loop, from the first alarm to an approved fix</text><text x="40" y="82" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4b5563" text-anchor="start">Each step ends in a number. Incident: the refund window drifts after a policy change.</text><rect x="40" y="116" width="170" height="240" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="116" width="170" height="6" rx="3" fill="#1d4ed8"/><text x="56" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#111827" text-anchor="start">Monitor</text><text x="56" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">Reads live signals.</text><text x="56" y="207" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">It needs no</text><text x="56" y="228" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">answer key.</text><line x1="56" y1="258" x2="194" y2="258" stroke="#cbd5e1"/><text x="56" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8" text-anchor="start">1 ticket</text><text x="56" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">to the first alarm</text><text x="56" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">(about 4 minutes)</text><polyline points="213,236.0 227,236.0" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="230" y="116" width="170" height="240" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="230" y="116" width="170" height="6" rx="3" fill="#b91c1c"/><text x="246" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#111827" text-anchor="start">Evaluate</text><text x="246" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">Replays the cases.</text><text x="246" y="207" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">The oracle scores</text><text x="246" y="228" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">each one.</text><line x1="246" y1="258" x2="384" y2="258" stroke="#cbd5e1"/><text x="246" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#b91c1c" text-anchor="start">−10.1 pts</text><text x="246" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">success change</text><text x="246" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">95% CI −17.4 to −4.3</text><polyline points="403,236.0 417,236.0" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="420" y="116" width="170" height="240" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="420" y="116" width="170" height="6" rx="3" fill="#15803d"/><text x="436" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#111827" text-anchor="start">Diagnose</text><text x="436" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">Tests the cause</text><text x="436" y="207" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">with a replay and</text><text x="436" y="228" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">a changed setting.</text><line x1="436" y1="258" x2="574" y2="258" stroke="#cbd5e1"/><text x="436" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#15803d" text-anchor="start">7 of 7</text><text x="436" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">cases fixed</text><text x="436" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">0 of 20 controls hurt</text><polyline points="593,236.0 607,236.0" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="610" y="116" width="170" height="240" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="610" y="116" width="170" height="6" rx="3" fill="#15803d"/><text x="626" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#111827" text-anchor="start">Fix</text><text x="626" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">The improvement</text><text x="626" y="207" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">loop picks a change</text><text x="626" y="228" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">on the dev split.</text><line x1="626" y1="258" x2="764" y2="258" stroke="#cbd5e1"/><text x="626" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#15803d" text-anchor="start">+10.1 pts</text><text x="626" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">on the test split</text><text x="626" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">CI +4.3 to +17.4</text><polyline points="783,236.0 797,236.0" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="800" y="116" width="170" height="240" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="800" y="116" width="170" height="6" rx="3" fill="#15803d"/><text x="816" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#111827" text-anchor="start">Gate</text><text x="816" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">Uses confidence</text><text x="816" y="207" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">limits, not point</text><text x="816" y="228" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">estimates.</text><line x1="816" y1="258" x2="954" y2="258" stroke="#cbd5e1"/><text x="816" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#15803d" text-anchor="start">8 of 8</text><text x="816" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">release gates</text><text x="816" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">passed</text><polyline points="973,236.0 987,236.0" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="990" y="116" width="170" height="240" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="990" y="116" width="170" height="6" rx="3" fill="#111827"/><text x="1006" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#111827" text-anchor="start">Approve</text><text x="1006" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">A person decides.</text><text x="1006" y="207" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">Rollback is</text><text x="1006" y="228" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">one command.</text><line x1="1006" y1="258" x2="1144" y2="258" stroke="#cbd5e1"/><text x="1006" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="start">1 person</text><text x="1006" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">with the</text><text x="1006" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">approver role</text><polyline points="1075.0,360 1075.0,396 125.0,396 125.0,362" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/><text x="600.0" y="424" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1d4ed8" text-anchor="middle">v2 runs in production. The monitor watches it again: 0 alerts.</text><text x="40" y="450" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Source: flagship demo (fdeops demo), fictional tenant Ledgerloop, stand-in model. Label: pipeline-test.</text>
</svg>
