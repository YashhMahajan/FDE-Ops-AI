<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 538" width="1200" height="538" role="img" aria-label="Success rates with 95% confidence intervals for the incident demo and for two example agents.">
<title>Success rates with 95% confidence intervals for the incident demo and for two example agents.</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#111827"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#1d4ed8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#15803d"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#b91c1c"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#6b7280"/></marker></defs>
<rect width="1200" height="538" fill="#ffffff"/>
<text x="40" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="start">Numbers, not adjectives: success with its 95% interval</text><text x="40" y="82" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4b5563" text-anchor="start">A dot is the measured rate. A line is the 95% confidence interval. The number of cases limits the width.</text><rect x="40" y="112" width="560" height="372" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="62" y="146" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="start">Incident and fix</text><text x="62" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">Ledgerloop test split, 69 cases, stand-in model</text><line x1="252.0" y1="192" x2="252.0" y2="418" stroke="#e5e7eb" stroke-width="1"/><text x="252.0" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">0%</text><line x1="317.0" y1="192" x2="317.0" y2="418" stroke="#e5e7eb" stroke-width="1"/><text x="317.0" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">25%</text><line x1="382.0" y1="192" x2="382.0" y2="418" stroke="#e5e7eb" stroke-width="1"/><text x="382.0" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">50%</text><line x1="447.0" y1="192" x2="447.0" y2="418" stroke="#e5e7eb" stroke-width="1"/><text x="447.0" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">75%</text><line x1="512.0" y1="192" x2="512.0" y2="418" stroke="#e5e7eb" stroke-width="1"/><text x="512.0" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">100%</text><text x="62" y="228.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#111827" text-anchor="start">v1 before the incident</text><line x1="498.22" y1="223.0" x2="512.0" y2="223.0" stroke="#15803d" stroke-width="3.5" stroke-linecap="round"/><circle cx="512.0" cy="223.0" r="8" fill="#15803d" stroke="#ffffff" stroke-width="2"/><text x="524" y="228.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803d" text-anchor="start">100.0%</text><text x="62" y="282.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#111827" text-anchor="start">v1 during the incident</text><line x1="461.3" y1="277.0" x2="499.0" y2="277.0" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round"/><circle cx="485.74" cy="277.0" r="8" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/><text x="524" y="282.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">89.9%</text><text x="62" y="336.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#111827" text-anchor="start">v2 with the fix</text><line x1="498.22" y1="331.0" x2="512.0" y2="331.0" stroke="#15803d" stroke-width="3.5" stroke-linecap="round"/><circle cx="512.0" cy="331.0" r="8" fill="#15803d" stroke="#ffffff" stroke-width="2"/><text x="524" y="336.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803d" text-anchor="start">100.0%</text><text x="62" y="390.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#111827" text-anchor="start">FAQ baseline, no LLM</text><line x1="346.9" y1="385.0" x2="406.44" y2="385.0" stroke="#6b7280" stroke-width="3.5" stroke-linecap="round"/><circle cx="376.28" cy="385.0" r="8" fill="#6b7280" stroke="#ffffff" stroke-width="2"/><text x="524" y="390.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6b7280" text-anchor="start">47.8%</text><text x="62" y="466" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">Paired change during the incident: −10.1 pts (95% CI −17.4 to −4.3), p = 0.016</text><rect x="620" y="112" width="540" height="372" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="642" y="146" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="start">Your agent against a naive agent</text><text x="642" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">Ledgerloop dev split, 51 cases, example agents</text><line x1="832.0" y1="192" x2="832.0" y2="310" stroke="#e5e7eb" stroke-width="1"/><text x="832.0" y="332" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">0%</text><line x1="892.0" y1="192" x2="892.0" y2="310" stroke="#e5e7eb" stroke-width="1"/><text x="892.0" y="332" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">25%</text><line x1="952.0" y1="192" x2="952.0" y2="310" stroke="#e5e7eb" stroke-width="1"/><text x="952.0" y="332" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">50%</text><line x1="1012.0" y1="192" x2="1012.0" y2="310" stroke="#e5e7eb" stroke-width="1"/><text x="1012.0" y="332" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">75%</text><line x1="1072.0" y1="192" x2="1072.0" y2="310" stroke="#e5e7eb" stroke-width="1"/><text x="1072.0" y="332" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">100%</text><text x="642" y="228.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#111827" text-anchor="start">naive_refunder.py</text><line x1="862.0" y1="223.0" x2="915.04" y2="223.0" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round"/><circle cx="883.84" cy="223.0" r="8" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/><text x="1084" y="228.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">21.6%</text><text x="642" y="282.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#111827" text-anchor="start">careful_refunder.py</text><line x1="988.96" y1="277.0" x2="1042.0" y2="277.0" stroke="#15803d" stroke-width="3.5" stroke-linecap="round"/><circle cx="1020.16" cy="277.0" r="8" fill="#15803d" stroke="#ffffff" stroke-width="2"/><text x="1084" y="282.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803d" text-anchor="start">78.4%</text><rect x="642" y="352" width="250" height="78" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="767" y="388" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#b91c1c" text-anchor="middle">33 of 51</text><text x="767" y="413" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">trials with a critical violation</text><rect x="910" y="352" width="232" height="78" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="1026" y="388" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#15803d" text-anchor="middle">0 of 51</text><text x="1026" y="413" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">trials with a critical violation</text><text x="642" y="454" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">Paired change: +56.9 pts (95% CI +43.1 to +70.6).</text><text x="642" y="474" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">Better in 29 cases. Worse in 0 cases.</text><text x="40" y="514" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Left: label pipeline-test (stand-in model). Right: label measured-in-simulation (rule-based example agents). The careful agent does refunds only.</text>
</svg>
