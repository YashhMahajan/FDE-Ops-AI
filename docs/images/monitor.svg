<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="Three monitor alarms on a timeline of tickets: the stale context alarm comes after one ticket, the page-level alarms after about fifty tickets.">
<title>Three monitor alarms on a timeline of tickets: the stale context alarm comes after one ticket, the page-level alarms after about fifty tickets.</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#111827"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#1d4ed8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#15803d"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#b91c1c"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#6b7280"/></marker></defs>
<rect width="1200" height="556" fill="#ffffff"/>
<text x="40" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="start">The monitor sees the drift without an answer key</text><text x="40" y="82" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4b5563" text-anchor="start">Live deployments have no oracle. The monitor uses signals that the platform can see in each ticket.</text><line x1="90" y1="250" x2="1110" y2="250" stroke="#111827" stroke-width="2"/><line x1="90.0" y1="250" x2="90.0" y2="258" stroke="#111827" stroke-width="2"/><text x="90.0" y="280" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle">0</text><line x1="260.0" y1="250" x2="260.0" y2="258" stroke="#111827" stroke-width="2"/><text x="260.0" y="280" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle">10</text><line x1="430.0" y1="250" x2="430.0" y2="258" stroke="#111827" stroke-width="2"/><text x="430.0" y="280" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle">20</text><line x1="600.0" y1="250" x2="600.0" y2="258" stroke="#111827" stroke-width="2"/><text x="600.0" y="280" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle">30</text><line x1="770.0" y1="250" x2="770.0" y2="258" stroke="#111827" stroke-width="2"/><text x="770.0" y="280" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle">40</text><line x1="940.0" y1="250" x2="940.0" y2="258" stroke="#111827" stroke-width="2"/><text x="940.0" y="280" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle">50</text><line x1="1110.0" y1="250" x2="1110.0" y2="258" stroke="#111827" stroke-width="2"/><text x="1110.0" y="280" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle">60</text><text x="600.0" y="306" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#4b5563" text-anchor="middle">tickets after the incident starts (13.3 tickets each hour)</text><line x1="107.0" y1="250" x2="107.0" y2="186" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/><circle cx="107.0" cy="250" r="9" fill="#1d4ed8" stroke="#ffffff" stroke-width="2.5"/><text x="121.0" y="112" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="start">stale_context</text><text x="121.0" y="136" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#111827" text-anchor="start">after 1 ticket</text><text x="121.0" y="156" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">about 4 minutes, severity: ticket</text><line x1="906.0" y1="250" x2="906.0" y2="186" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/><circle cx="906.0" cy="250" r="9" fill="#b45309" stroke="#ffffff" stroke-width="2.5"/><text x="892.0" y="112" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#b45309" text-anchor="end">policy_flag</text><text x="892.0" y="136" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#111827" text-anchor="end">after 48 tickets</text><text x="892.0" y="156" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="end">about 3.6 hours, severity: page</text><line x1="940.0" y1="250" x2="940.0" y2="264" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="940.0" cy="250" r="9" fill="#b91c1c" stroke="#ffffff" stroke-width="2.5"/><text x="954.0" y="190" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#b91c1c" text-anchor="start">critical_flag</text><text x="954.0" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#111827" text-anchor="start">after 50 tickets</text><text x="954.0" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">about 3.8 hours, severity: page</text><rect x="40" y="346" width="1120" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Signal rate: reference window against incident window</text><text x="60" y="416" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="15" font-weight="650" fill="#111827" text-anchor="start">stale_context</text><text x="60" y="448" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#6b7280" text-anchor="start">0.0%</text><polyline points="138,441 178,441" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="188" y="448" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#b91c1c" text-anchor="start">84.1%</text><text x="430" y="416" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="15" font-weight="650" fill="#111827" text-anchor="start">policy_flag</text><text x="430" y="448" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#6b7280" text-anchor="start">0.0%</text><polyline points="508,441 548,441" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="558" y="448" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#b91c1c" text-anchor="start">10.1%</text><text x="800" y="416" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="15" font-weight="650" fill="#111827" text-anchor="start">critical_flag</text><text x="800" y="448" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#6b7280" text-anchor="start">0.0%</text><polyline points="878,441 918,441" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="928" y="448" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#b91c1c" text-anchor="start">10.1%</text><text x="60" y="482" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">An alert needs the whole 95% interval of the change to be above the tolerance. The monitor saw 7 of 7 failed trials. 0 were silent.</text><text x="40" y="532" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Source: flagship demo, fictional tenant Ledgerloop, stand-in model. Label: pipeline-test.</text>
</svg>
