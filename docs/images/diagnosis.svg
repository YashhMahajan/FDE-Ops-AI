<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-label="A failing cluster is replayed with three interventions. The cause is confirmed only when the cluster is fixed and no control case breaks.">
<title>A failing cluster is replayed with three interventions. The cause is confirmed only when the cluster is fixed and no control case breaks.</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#111827"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#1d4ed8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#15803d"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#b91c1c"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#6b7280"/></marker></defs>
<rect width="1200" height="584" fill="#ffffff"/>
<text x="40" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="start">A cause is confirmed only when the fix works and breaks nothing</text><text x="40" y="82" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4b5563" text-anchor="start">The platform replays the failing cases with one change at a time, and it replays control cases too.</text><rect x="40" y="150" width="270" height="190" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="60" y="188" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start">Failing cluster</text><text x="60" y="218" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="15.5" font-weight="650" fill="#b91c1c" text-anchor="start">stale_knowledge</text><text x="60" y="242" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">on refund_outside_window</text><text x="60" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="start">7 trials, 7 cases</text><text x="60" y="304" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">The agent got the superseded</text><text x="60" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">section refund-policy@v1.</text><polyline points="314,245 372,164" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-grey)"/><rect x="376" y="128" width="400" height="74" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="394" y="160" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" font-weight="650" fill="#1d4ed8" text-anchor="start">freshness_filter</text><text x="394" y="184" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">Drop superseded sections</text><polyline points="780,165 812,165" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="816" y="136" width="150" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="891" y="161" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">7 of 7</text><text x="891" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">cluster cases fixed</text><rect x="978" y="136" width="182" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="1069" y="161" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">0 of 20</text><text x="1069" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">control cases broken</text><polyline points="314,245 372,254" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-grey)"/><rect x="376" y="218" width="400" height="74" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="394" y="250" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" font-weight="650" fill="#1d4ed8" text-anchor="start">current_index_only</text><text x="394" y="274" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">Index only the current version</text><polyline points="780,255 812,255" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="816" y="226" width="150" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="891" y="251" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">7 of 7</text><text x="891" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">cluster cases fixed</text><rect x="978" y="226" width="182" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="1069" y="251" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">0 of 20</text><text x="1069" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">control cases broken</text><polyline points="314,245 372,344" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-grey)"/><rect x="376" y="308" width="400" height="74" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="394" y="340" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" font-weight="650" fill="#1d4ed8" text-anchor="start">oracle_retrieval</text><text x="394" y="364" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">Give the correct section (upper bound)</text><polyline points="780,345 812,345" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="816" y="316" width="150" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="891" y="341" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">7 of 7</text><text x="891" y="362" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">cluster cases fixed</text><rect x="978" y="316" width="182" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="1069" y="341" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">0 of 20</text><text x="1069" y="362" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">control cases broken</text><text x="891" y="114" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle">Does it fix the cluster?</text><text x="1069" y="114" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle">Does it break a control?</text><rect x="376" y="416" width="784" height="96" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/><rect x="376" y="416" width="8" height="96" rx="4" fill="#15803d"/><text x="404" y="452" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#15803d" text-anchor="start">Verdict: confirmed by intervention</text><text x="404" y="480" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#4b5563" text-anchor="start">Rule: the change fixes the cluster and breaks no control case.</text><text x="404" y="500" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">If it fixes the cluster but breaks a control, the verdict is supported. If it does not fix, inconclusive.</text><polyline points="891,386 891,400 1069,400 1069,386" fill="none" stroke="#15803d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="980,400 980,412" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/><text x="40" y="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Source: flagship demo, fictional tenant Ledgerloop, stand-in model. Label: pipeline-test.</text>
</svg>
