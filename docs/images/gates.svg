<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="A release bundle goes through eight gates and a person's approval before the production pointer moves; rollback is one command.">
<title>A release bundle goes through eight gates and a person's approval before the production pointer moves; rollback is one command.</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#111827"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#1d4ed8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#15803d"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#b91c1c"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#6b7280"/></marker></defs>
<rect width="1200" height="556" fill="#ffffff"/>
<text x="40" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827" text-anchor="start">A release moves only through gates, then a person</text><text x="40" y="82" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4b5563" text-anchor="start">Gates use confidence limits. A gate that the platform cannot measure fails.</text><rect x="40" y="150" width="250" height="210" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="188" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start">Release bundle</text><text x="60" y="218" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">model</text><text x="60" y="240" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">+ prompt</text><text x="60" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">+ retrieval settings</text><text x="60" y="284" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">+ tools</text><text x="60" y="306" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">+ knowledge base</text><text x="60" y="328" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">+ dataset</text><text x="60" y="352" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#1d4ed8" text-anchor="start">one hash: sha256:…</text><polyline points="294,255 338,255" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="342" y="118" width="520" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="362" y="148" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#111827" text-anchor="start">8 gates, from tenants/ledgerloop/gates.yaml</text><rect x="358" y="166" width="238" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="378" cy="191" r="7" fill="#15803d"/><text x="394" y="188" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#111827" text-anchor="start">Task success</text><text x="394" y="206" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">95% lower limit ≥ 85%</text><rect x="358" y="224" width="238" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="378" cy="249" r="7" fill="#15803d"/><text x="394" y="246" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#111827" text-anchor="start">Critical violations</text><text x="394" y="264" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">0 trials, upper limit ≤ 6%</text><rect x="358" y="282" width="238" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="378" cy="307" r="7" fill="#15803d"/><text x="394" y="304" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#111827" text-anchor="start">Non-inferiority</text><text x="394" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">no slice worse by &gt; 3 pts</text><rect x="358" y="340" width="238" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="378" cy="365" r="7" fill="#15803d"/><text x="394" y="362" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#111827" text-anchor="start">Latency</text><text x="394" y="380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">p95 ≤ 8 s</text><rect x="606" y="166" width="238" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="626" cy="191" r="7" fill="#15803d"/><text x="642" y="188" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#111827" text-anchor="start">Cost</text><text x="642" y="206" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">≤ $0.05 for each resolution</text><rect x="606" y="224" width="238" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="626" cy="249" r="7" fill="#15803d"/><text x="642" y="246" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#111827" text-anchor="start">Integration suite</text><text x="642" y="264" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">faults, no double refund</text><rect x="606" y="282" width="238" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="626" cy="307" r="7" fill="#15803d"/><text x="642" y="304" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#111827" text-anchor="start">Regression suite</text><text x="642" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">each past incident passes</text><rect x="606" y="340" width="238" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="626" cy="365" r="7" fill="#15803d"/><text x="642" y="362" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#111827" text-anchor="start">Judge calibration</text><text x="642" y="380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">agreement kappa ≥ 0.6</text><polyline points="866,255 910,255" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="914" y="150" width="246" height="100" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="934" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start">Approval</text><text x="934" y="212" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">A person with the</text><text x="934" y="232" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">approver role signs.</text><polyline points="1037,254 1037,292" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="914" y="296" width="246" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="934" y="332" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="start">Production pointer</text><text x="934" y="358" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">moves to v2, and the</text><text x="934" y="378" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" text-anchor="start">incident joins the suite.</text><polyline points="1037,430 1037,400" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/><text x="1050" y="420" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="start">if a release fails</text><rect x="914" y="432" width="246" height="56" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="934" y="456" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#b91c1c" text-anchor="start">Rollback</text><text x="934" y="476" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">one command, back to v1</text><text x="40" y="530" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Source: Ledgerloop gate file. The flagship demo passed 8 of 8 gates for v2 (stand-in model, label: pipeline-test).</text>
</svg>
