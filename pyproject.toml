[project]
name = "fdeops"
version = "0.1.0"
description = "FDE-Ops-AI: deploy, evaluate, diagnose, and improve AI agents in real business workflows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yashh Mahajan" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "numpy>=1.26",
  "scipy>=1.12",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.scripts]
fdeops = "fdeops.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.1",
  "types-PyYAML",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdeops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF012: pydantic copies mutable field defaults per instance, so `x: dict = {}` is safe there.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fdeops.core.*", "fdeops.eval.*"]
strict = true

[tool.importlinter]
root_package = "fdeops"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "fdeops.cli",
  "fdeops.eval",
  "fdeops.agent",
  "fdeops.tenancy",
  "fdeops.packs",
  "fdeops.connectors",
  "fdeops.llm | fdeops.trace | fdeops.retrieval | fdeops.world",
  "fdeops.core",
]
