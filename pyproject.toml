[project]
name = "fdeops"
version = "2.1.0"
description = "FDE-Ops-AI: deploy, evaluate, diagnose, and improve AI agents in real business workflows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yashh Mahajan" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "numpy>=1.26",
  "scipy>=1.12",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
# The API service, the job worker and Postgres. The core library does not need them.
server = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
]

[project.scripts]
fdeops = "fdeops.cli.main:app"

[dependency-groups]
dev = [
  "fdeops[server]",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.1",
  "types-PyYAML",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdeops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  # Raised inside starlette's own test client; not actionable here.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "BLE"]
# RUF012: pydantic copies mutable field defaults per instance, so `x: dict = {}` is safe there.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as argument defaults by design.
"src/fdeops/cli/*" = ["B008"]
# The simulation uses seeded pseudo-random numbers on purpose: results must be reproducible.
# No security decision uses them. Secrets and IDs use os.urandom and secrets.
"src/fdeops/packs/*" = ["S311"]
"src/fdeops/world/*" = ["S311"]
"src/fdeops/eval/incidents.py" = ["S311"]
"src/fdeops/agent/episode.py" = ["S311"]
# Tests use assert, fixed fake keys and seeded random numbers.
"tests/*" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fdeops.core.*", "fdeops.eval.*"]
strict = true

[tool.importlinter]
root_package = "fdeops"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "fdeops.cli",
  "fdeops.api",
  "fdeops.demo",
  "fdeops.jobs",
  "fdeops.storage",
  "fdeops.insights",
  "fdeops.impact",
  "fdeops.improve",
  "fdeops.release",
  "fdeops.diagnose | fdeops.monitor",
  "fdeops.eval",
  "fdeops.agent",
  "fdeops.tenancy",
  "fdeops.packs",
  "fdeops.connectors",
  "fdeops.world",
  "fdeops.llm | fdeops.trace | fdeops.retrieval | fdeops.devtools",
  "fdeops.core",
]

[tool.deptry]
# psycopg is the Postgres driver of SQLAlchemy: the code names it only in database URLs.
per_rule_ignores = { DEP002 = ["psycopg"] }

[tool.deptry.package_module_name_map]
pyyaml = "yaml"
