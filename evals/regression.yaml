# Evaluation regression checks. CI replays each check from its cassette: no model call, no cost.
# A check without a cassette is skipped until you record it.
#
# Record with OpenRouter (free models):  MODEL=<id>:free scripts/record_openrouter.sh
# Record with vLLM on a free Kaggle GPU:  kaggle/fdeops_vllm_recording.ipynb
#
# The cassette keys include the model name. Thus, replay needs the same model as the recording.
# After a recording, set min_success_lower to the lower limit of the recorded run, minus a margin.
checks:
  - name: ledgerloop-production-dev
    tenant: ../tenants/ledgerloop
    agent: ../configs/agents/ledgerloop-production.yaml
    provider: openrouter
    model: CHOOSE-A-FREE-MODEL:free
    split: dev
    limit: 12
    cassettes: cassettes/ledgerloop-production-dev.jsonl
    min_success_lower: 0.30
  - name: parcelpoint-production-dev
    tenant: ../tenants/parcelpoint
    agent: ../configs/agents/parcelpoint-production.yaml
    provider: openrouter
    model: CHOOSE-A-FREE-MODEL:free
    split: dev
    limit: 12
    cassettes: cassettes/parcelpoint-production-dev.jsonl
    min_success_lower: 0.30
