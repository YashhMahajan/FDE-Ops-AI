# The static web UI. The image runs nginx as a user without root rights, on port 8080.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The site runs only its own code. Next.js puts small inline scripts in each page.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }
  location /demo/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }
}
