name: Bug report
description: Something does not work as the documents say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Give the command, the output and what you expected.
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The shortest list of commands that shows the problem.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `fdeops version`
    validations: {required: true}
  - type: input
    id: env
    attributes:
      label: Environment
      description: Operating system, Python version, and how you installed the package
