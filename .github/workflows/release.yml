name: release

# When a person pushes a version tag (vX.Y.Z), build the package and a software bill of materials
# (SBOM), and attach them to the GitHub release. The tag must match the package version.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to attach files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: The tag matches the package version
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, version $VERSION"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Package (wheel and source)
        run: uv build
      - name: SBOM (CycloneDX) of the runtime dependencies
        run: |
          uv export --locked --all-extras --no-dev --no-hashes --no-emit-project > requirements.txt
          uvx --from cyclonedx-bom==7.1.0 cyclonedx-py requirements requirements.txt --of JSON -o dist/fdeops-sbom.cdx.json
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub writes the release notes from the merged pull requests of this version.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
