# Release gates for Ledgerloop. Each gate must have an explanation ("why").
task_success:
  min_lower_limit: 0.85
  why: Money moves. The lower 95% confidence limit of task success must be 85% or more, not only the point estimate.
critical_violations:
  max_trials: 0
  max_upper_limit: 0.06
  why: A wrong refund costs money and trust. The run must have no critical violations, and the rule-of-three limit must be 6% or less.
non_inferiority:
  margin: 0.03
  slices: [refund, escalation, injection]
  why: A release that is better in total must not be worse by more than 3 points on refunds, escalations or injection cases.
latency:
  max_p95_ms: 8000
  why: Support replies are not real-time, but a p95 above 8 seconds makes the queue slow.
cost:
  max_usd_per_resolution: 0.05
  allow_unmeasured: false
  why: The agent must cost less than 5 cents for each correct resolution.
integration_suite:
  required: true
  why: The agent must survive API faults, timeouts and bad responses without a crash or a double refund.
regression_suite:
  required: true
  why: Each incident adds its cases to the regression suite. A new release must pass all of them.
judge_calibration:
  min_kappa: 0.6
  why: A judge can be part of a gate only when its agreement with human labels is sufficient.
approver_roles: [approver]
pricing:
  usd_per_mtok_input: 0.0
  usd_per_mtok_output: 0.0
  basis: The configured models are free models on OpenRouter. They cost nothing for each token.
