# Business assumptions for the Ledgerloop ROI model. These are ASSUMPTIONS, not measurements.
# Each value has a low, a likely and a high value. The Monte Carlo simulation uses the range.
currency: USD
staff_cost_per_hour: {low: 32, likely: 40, high: 52, source: "fictional support-team salary band, loaded cost"}
monthly_ticket_volume: {low: 9000, likely: 12000, high: 15000, source: "fictional ticket history"}
adoption_rate: {low: 0.6, likely: 0.8, high: 0.95, source: "share of tickets sent to the agent after rollout"}
handling_minutes:
  refund: {low: 6, likely: 9, high: 14, source: "time study of human agents (fictional)"}
  billing_question: {low: 4, likely: 6, high: 9, source: "time study (fictional)"}
  knowledge: {low: 3, likely: 5, high: 8, source: "time study (fictional)"}
  account_change: {low: 4, likely: 7, high: 10, source: "time study (fictional)"}
  data_export: {low: 3, likely: 5, high: 8, source: "time study (fictional)"}
  security: {low: 8, likely: 12, high: 20, source: "time study (fictional)"}
  identity: {low: 2, likely: 4, high: 6, source: "time study (fictional)"}
  default: {low: 4, likely: 7, high: 11, source: "average of the categories"}
rework_minutes: {low: 4, likely: 8, high: 15, source: "more human time when the agent gives a wrong result"}
triage_saving_minutes: {low: 0, likely: 1, high: 3, source: "time that an escalation note saves the specialist"}
critical_error_cost: {low: 120, likely: 300, high: 900, source: "a wrong refund or a data leak: money, support and churn"}
infrastructure_per_month: {low: 0, likely: 40, high: 120, source: "one small VM; free models on OpenRouter"}
maintenance_per_month: {low: 800, likely: 1500, high: 2500, source: "a part of an engineer for evaluation and upkeep"}
integration_one_time: {low: 12000, likely: 18000, high: 30000, source: "four to eight FDE weeks"}
