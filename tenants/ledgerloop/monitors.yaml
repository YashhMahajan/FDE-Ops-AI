# Production monitors for Ledgerloop. Each monitor must have an explanation ("why").
# A rate tolerance is an absolute change. A value tolerance is a relative change.
cusum_threshold: 3.0
monitors:
  - signal: critical_flag
    tolerance: 0.0
    shift: 0.05
    severity: page
    why: Money moves. An increase of critical operations is a page, also when it is small.
  - signal: policy_flag
    tolerance: 0.02
    severity: page
    why: A policy flag is the first sign that we can see of a wrong refund or a wrong export.
  - signal: stale_context
    tolerance: 0.02
    severity: ticket
    why: Superseded policy text in the context comes before wrong answers. It shows document drift before the wrong answers occur.
  - signal: escalation
    tolerance: 0.05
    severity: ticket
    why: More escalations cost staff time. Fewer escalations can also be a risk. Thus, a second monitor looks for a decrease.
  - signal: escalation
    direction: down
    tolerance: 0.05
    severity: ticket
    why: A fast decrease of escalations can show that the agent completes tasks that it must not do.
  - signal: tool_error
    tolerance: 0.03
    severity: page
    why: Tool errors show an API outage or a schema change in a customer system.
  - signal: episode_error
    tolerance: 0.02
    severity: page
    why: Model errors and step-budget stops show a model change or a provider outage.
  - signal: latency_ms
    statistic: p95
    tolerance: 0.25
    severity: ticket
    why: The p95 gate is 8 seconds. An increase of 25% or more of p95 is a warning before the gate fails.
  - signal: tokens
    statistic: mean
    tolerance: 0.25
    severity: ticket
    why: More tokens for each ticket show a prompt or retrieval change, and they increase the cost.
